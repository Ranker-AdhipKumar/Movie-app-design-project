name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Recreate Android Platform Files
        run: |
          flutter create . --platforms=android --org com.example --project-name movie_app
          
          # Upgrade Gradle wrapper to 8.5 (compatible with AGP 8.3+)
          python3 -c "
          p = 'android/gradle/wrapper/gradle-wrapper.properties'
          with open(p, 'r') as f:
              c = f.read()
          import re
          c = re.sub(r'gradle-[\d\.]+-all\.zip', 'gradle-8.5-all.zip', c)
          c = re.sub(r'gradle-[\d\.]+-bin\.zip', 'gradle-8.5-all.zip', c)
          with open(p, 'w') as f:
              f.write(c)
          "
          
          # Ensure Internet permission is in AndroidManifest.xml
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              c = f.read()
          if 'android.permission.INTERNET' not in c:
              c = c.replace('<application', '    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <application')
              with open(p, 'w') as f:
                  f.write(c)
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
